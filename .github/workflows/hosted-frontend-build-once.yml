name: One-off Exact Frontend Artifact

on:
  push:
    branches: [codex/build-quota-rollout-frontend]

permissions:
  contents: read
  packages: write

concurrency:
  group: one-off-frontend-f40f2a31
  cancel-in-progress: false

jobs:
  frontend-artifact:
    if: github.repository == 'assembledhq/143' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: f40f2a31b1eae5e3e6b846779c5a66f266b5ec38
          path: release
          persist-credentials: false

      - name: Run local receipt verifier tests
        run: python3 -B workflow-source/.github/scripts/hosted-frontend-receipt_test.py

      - name: Create isolated hosted builder
        id: builder
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: true

      - name: Log in with the ephemeral repository token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build, export fresh OCI, publish once, and verify
        env:
          OWNED_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -euo pipefail
          python3 -B workflow-source/.github/scripts/hosted-frontend-receipt.py \
            --execute --source "$GITHUB_WORKSPACE/release" \
            --helper-source "$GITHUB_WORKSPACE/workflow-source" \
            --output "$RUNNER_TEMP/frontend-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --builder "$OWNED_BUILDER"

      - name: Upload only compact public image provenance or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-frontend-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend-artifact-${{ github.run_id }}-${{ github.run_attempt }}/public-receipt.json
            ${{ runner.temp }}/frontend-artifact-${{ github.run_id }}-${{ github.run_attempt }}/public-failure.json
          if-no-files-found: warn
          retention-days: 14
