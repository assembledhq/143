name: One-off Exact Release Artifacts

on:
  push:
    branches: [codex/build-rollout-artifacts-efbb500dad032e1282ec8f1e367d641fcc493f22]

permissions:
  contents: read
  packages: write

concurrency:
  group: one-off-release-artifacts-efbb500dad032e1282ec8f1e367d641fcc493f22
  cancel-in-progress: false

jobs:
  image-artifact:
    if: github.repository == 'assembledhq/143' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Cancelling a sibling during publication would create an unknown outcome.
      fail-fast: false
      matrix:
        image: [server, sandbox, frontend]
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false

      - name: Check out exact release source
        uses: actions/checkout@v6
        with:
          ref: efbb500dad032e1282ec8f1e367d641fcc493f22
          path: release
          persist-credentials: false

      - name: Run synthetic verifier tests
        run: python3 -B workflow-source/.github/scripts/release-images-once_test.py

      - name: Create isolated hosted builder
        id: builder
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: true

      - name: Log in with the ephemeral repository token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build, export genuine OCI, publish once, and verify
        env:
          OWNED_BUILDER: ${{ steps.builder.outputs.name }}
          IMAGE_KEY: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python3 -B workflow-source/.github/scripts/release-images-once.py \
            --execute --image "$IMAGE_KEY" \
            --source "$GITHUB_WORKSPACE/release" \
            --helper-source "$GITHUB_WORKSPACE/workflow-source" \
            --output "$RUNNER_TEMP/image-artifact-$IMAGE_KEY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --builder "$OWNED_BUILDER"

      - name: Upload only compact image provenance or fixed failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-image-provenance-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-artifact-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}/public-receipt.json
            ${{ runner.temp }}/image-artifact-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}/public-intent.json
            ${{ runner.temp }}/image-artifact-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}/public-failure.json
          if-no-files-found: warn
          retention-days: 14
