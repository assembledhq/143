name: CI

on:
  pull_request:
    branches: [main, 'codex/review-evidence-*']
  push:
    branches: [main]
  schedule:
    # Twice daily: the scheduled run is the only place the full frontend
    # suite executes with coverage, so cap the exposure window for a
    # cross-cutting break that affected-test runs missed to ~12 hours.
    - cron: "17 10,22 * * *"
  workflow_dispatch:
    inputs:
      review_workspace_acceptance:
        description: Run the real Docker and gVisor review workspace acceptance suite
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  GOFLAGS: "-buildvcs=false"
  NODE_VERSION: "24"
  BACKEND_COVERAGE_MIN: "70.0"
  BACKEND_COVERAGE_TARGET: "75.0"
  FRONTEND_COVERAGE_MIN: "80.0"
  FRONTEND_COVERAGE_TARGET: "85.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      demo_seed: ${{ steps.filter.outputs.demo_seed }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy: ${{ steps.filter.outputs.deploy }}
      ci: ${{ steps.filter.outputs.ci }}
      session_transcript_e2e: ${{ steps.filter.outputs.session_transcript_e2e }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.143/config.json'
              - '.143/review-dependencies*'
            frontend:
              - 'frontend/**'
            migrations:
              - 'migrations/**'
              - 'cmd/migrate/**'
              - 'go.mod'
              - 'go.sum'
            demo_seed:
              - '.143/seed/**'
              - 'cmd/demo-seed/**'
              - 'internal/demoseed/**'
              - 'migrations/**'
              - 'Makefile'
            docker:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'frontend/Dockerfile*'
              - 'sandbox/Dockerfile*'
              - 'sandbox/versions.json'
              - '.dockerignore'
            deploy:
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'go.mod'
              - 'go.sum'
            ci:
              - '.github/workflows/**'
              - '.github/scripts/**'
            # Keep this deliberately broad while activity capsules own the
            # transcript renderer. One central classifier prevents required
            # checks from silently disappearing on backend contract changes.
            session_transcript_e2e:
              - 'frontend/**'
              - 'internal/**'
              - 'migrations/**'
              - '.github/workflows/**'

  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.migrations == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Multi-tenancy guardrails (schema + stores)
        run: make lint-tenancy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  backend-test:
    name: Backend Test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.demo_seed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
      # Drives DB-backed migration behavior tests (e.g. the coding-credential
      # versioning test in internal/db). They self-skip when unset, so this
      # must point at the job's Postgres container or they never run anywhere.
      TEST_DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test CI helper scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Start Postgres with registry fallback
        id: postgres
        timeout-minutes: 10
        run: bash .github/scripts/start-ci-postgres.sh
      - name: Preload preview infrastructure test image
        timeout-minutes: 10
        # Fail early if every source is unavailable, before compiling the suite.
        # Preserve the production template's image name and PostgreSQL variant.
        run: |
          bash .github/scripts/pull-ci-image.sh postgres:17-alpine \
            public.ecr.aws/docker/library/postgres:17-alpine \
            mirror.gcr.io/library/postgres:17-alpine \
            postgres:17-alpine
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test review dependency recipe
        run: python3 -B .143/review-dependencies_test.py

      - name: Download Go modules
        run: go mod download

      - name: Wait for Postgres
        run: go run ./cmd/wait-postgres

      - name: Verify Postgres lock table size for parallel schema tests
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        # Parallel fixtures apply the full migration chain in isolated schemas.
        # Dropping those schemas together can exhaust the default lock table.
        # The container starts with the larger lock table; verify it before migrations.
        run: |
          actual=$(docker exec "$POSTGRES_CONTAINER" psql -U onefortythree -d onefortythree -At \
            -c 'SHOW max_locks_per_transaction')
          echo "max_locks_per_transaction=$actual"
          test "$actual" = "256"

      - name: Run go vet and migrations
        run: |
          go run cmd/migrate/main.go up
          go vet ./...

      - name: Validate demo seed against the migrated schema
        if: needs.changes.outputs.demo_seed == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
        run: make demo-seed-check

      - name: Run tests (PR — no race)
        if: github.event_name == 'pull_request'
        run: go test ./internal/... -skip '^TestBrowserChromeDP' -coverpkg=./internal/... -coverprofile=coverage-unit.out -covermode=count -timeout=120s

      - name: Run tests with race + coverage (non-PR)
        if: github.event_name != 'pull_request'
        run: |
          go test ./internal/... -skip '^TestBrowserChromeDP' -coverpkg=./internal/... -coverprofile=coverage-unit.out -covermode=atomic -race -timeout=180s

      # Chrome startup and rendering need CPU that the parallel backend suite
      # can otherwise consume. Keep real browser fixtures in a serial step,
      # with the same race mode and their own coverage contribution.
      - name: Run preview browser lifecycle tests
        timeout-minutes: 5
        env:
          TEST_BROWSER_REQUIRED: "1"
        run: |
          preview_chrome_path="$(command -v google-chrome)"
          preview_chrome_binary="$(readlink -f "$preview_chrome_path")"
          test -x "$preview_chrome_binary"
          preview_chrome_version="$(timeout 5s "$preview_chrome_binary" --version)"
          case "$preview_chrome_version" in
            "Google Chrome "*) ;;
            *) echo "CI browser must identify as Google Chrome" >&2; exit 1 ;;
          esac
          preview_chrome_dir="$(mktemp -d "${RUNNER_TEMP:?}/preview-chrome.XXXXXX")"
          trap 'rm -rf "$preview_chrome_dir"' EXIT
          # chromedp discovers headless_shell and Chromium before Google Chrome.
          # This runner-owned alias selects validated Google Chrome for this fixture step.
          ln -s "$preview_chrome_binary" "$preview_chrome_dir/headless_shell"
          test "$(readlink -f "$preview_chrome_dir/headless_shell")" = "$preview_chrome_binary"
          printf 'Preview test browser: %s (%s)\n' "$preview_chrome_binary" "$preview_chrome_version"
          mode=count
          race=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
          fi
          PATH="$preview_chrome_dir:$PATH" go test ./internal/services/preview -run '^TestBrowserChromeDP' -parallel=1 -count=1 -v \
            -coverpkg=./internal/... -coverprofile=coverage-browser.out -covermode="$mode" \
            "${race[@]}" -timeout=180s

      # Integration tests run on every backend-test invocation (PR + push).
      # They reuse the Postgres container this job already brings up — no new
      # infra. Build-tag gating means they don't run during the unit-test
      # step above, so we don't double-charge CI for the same code paths.
      - name: Run integration tests
        run: |
          mode=count
          race=()
          timeout=120s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            timeout=180s
          fi
          INTEGRATION_DATABASE_URL=$DATABASE_URL \
          go test -tags=integration -coverpkg=./internal/... -coverprofile=coverage-integration.out \
            -covermode="$mode" "${race[@]}" -timeout="$timeout" ./internal/integration/...

      # Exercise real image-declared volumes: mocks cannot prove that Docker
      # removed preview data or preserved explicitly named storage.
      - name: Verify preview infrastructure volume lifecycle
        run: go test -tags=docker_integration ./internal/services/preview/providers -run '^TestDockerIntegration' -count=1 -timeout=180s

      # Measure all backend code exercised by the successful suites, without
      # double-counting statements shared by multiple test binaries.
      - name: Combine backend coverage
        run: |
          python3 .github/scripts/merge_go_coverage.py coverage.out coverage-unit.out coverage-browser.out coverage-integration.out
          go tool cover -func=coverage.out

      - name: Check backend coverage floor
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/check_go_coverage.py coverage.out \
            "$BACKEND_COVERAGE_MIN" "$BACKEND_COVERAGE_TARGET"

      - name: Upload coverage report
        # Keep the evidence available when tests or the coverage floor fail.
        if: ${{ !cancelled() && hashFiles('coverage*.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage-unit.out
            coverage-browser.out
            coverage-integration.out

      - name: Stop CI Postgres
        if: always() && steps.postgres.outputs.container_id != ''
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        run: docker rm --force --volumes "$POSTGRES_CONTAINER"

  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  frontend-test:
    name: Frontend Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Materialize PR base ref (PR only)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse --verify "${PR_BASE_SHA}^{commit}"
          git branch -f pr-base "${PR_BASE_SHA}"

      # Main pushes run affected tests against the previous main SHA instead
      # of the full suite: the merged PR already ran the same affected set,
      # and the full suite (~10 min on a 2-core runner) was burning that time
      # on every merge. The twice-daily scheduled run still executes the full
      # suite with coverage as the backstop. github.event.before is all
      # zeros on branch creation and unreachable after a force push, so fall
      # back to the full suite when it can't be resolved.
      - name: Materialize push base ref (main push only)
        if: github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify --quiet "${PUSH_BASE_SHA}^{commit}"; then
            git branch -f push-base "$PUSH_BASE_SHA"
            echo "FRONTEND_FULL_RUN=false" >> "$GITHUB_ENV"
          else
            echo "push base $PUSH_BASE_SHA unavailable; running full suite"
            echo "FRONTEND_FULL_RUN=true" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Run affected tests (PR)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: npx vitest run --changed=pr-base --passWithNoTests

      - name: Run affected tests (main)
        if: github.event_name == 'push'
        timeout-minutes: 10
        run: |
          if [ "$FRONTEND_FULL_RUN" = "true" ]; then
            npx vitest run --reporter=dot
          else
            npx vitest run --changed=push-base --passWithNoTests --reporter=dot
          fi

      - name: Run full tests with coverage (scheduled/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=lcov

      - name: Check frontend coverage floor (scheduled/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(data.total.lines.pct);
          ")
          echo "Total coverage: ${COVERAGE}%"
          if node -e "process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)" "$COVERAGE" "${FRONTEND_COVERAGE_MIN}"; then
            echo "::error::Frontend coverage ${COVERAGE}% is below the minimum ${FRONTEND_COVERAGE_MIN}%"
            exit 1
          fi
          if node -e "process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)" "$COVERAGE" "${FRONTEND_COVERAGE_TARGET}"; then
            echo "::warning::Frontend coverage ${COVERAGE}% is below target ${FRONTEND_COVERAGE_TARGET}%"
          fi

      - name: Upload coverage report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  session-transcript-e2e:
    name: Session Transcript E2E
    needs: changes
    # required-checks treats a skipped job as passing, so a plain job-level
    # condition is enough — matching every other conditional job here.
    if: needs.changes.outputs.session_transcript_e2e == 'true' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser engines
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run focused transcript browser suite
        env:
          SESSION_ACTIVITY_BROWSER_MATRIX: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: npm run test:session-transcript-e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-transcript-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  migration-check:
    name: Migration Safety
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres with registry fallback
        id: postgres
        timeout-minutes: 10
        run: bash .github/scripts/start-ci-postgres.sh
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Wait for Postgres
        run: go run ./cmd/wait-postgres

      - name: Validate migration filenames
        run: go test ./cmd/migrate -run TestMigrationVersionsAreUnique -count=1

      - name: Migrate up
        run: go run cmd/migrate/main.go up

      - name: Migrate down
        run: go run cmd/migrate/main.go down

      - name: Migrate up again (idempotency check)
        run: go run cmd/migrate/main.go up

      - name: Stop CI Postgres
        if: always() && steps.postgres.outputs.container_id != ''
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        run: docker rm --force --volumes "$POSTGRES_CONTAINER"

  docker-build:
    name: Docker Build
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            tags: 143-app:latest
          - name: sandbox
            context: .
            file: sandbox/Dockerfile
            tags: 143-sandbox:latest
          - name: frontend
            context: .
            file: Dockerfile.frontend
            tags: 143-frontend:latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          # Bootstrap must use the cache before BuildKit's mirror config is active.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Cache Docker Hub images through Google's public mirror for CI builds.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build ${{ matrix.name }} Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec ./...

  # Config tests read repository-wide inputs; run them for every PR and push.
  deploy-config-test:
    name: Deploy Config Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate deployment configuration
        run: |
          go test ./deploy -count=1 -timeout=120s
          go vet ./deploy
      - name: Verify acceptance runtime safety contracts
        run: python3 .github/scripts/test_review_acceptance_runtime.py

  deploy-scripts-test:
    name: Deploy Scripts Test
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run deploy shell tests
        run: |
          set -euo pipefail
          for t in deploy/scripts/*_test.sh; do
            echo "--- $t"
            bash "$t"
          done

  review-workspace-acceptance:
    name: Review Workspace Container Acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.review_workspace_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REVIEW_ACCEPTANCE_IMAGE: 143-review-acceptance:${{ github.sha }}
      REVIEW_ACCEPTANCE_NETWORK: review-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEW_ACCEPTANCE_RUNTIME: runsc
      REVIEW_ACCEPTANCE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Initialize acceptance evidence directory
        run: printf 'REVIEW_ACCEPTANCE_ARTIFACT_DIR=%s/review-workspace-acceptance\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify Linux credential ancestry fixture before image build
        run: |
          mkdir -p "$REVIEW_ACCEPTANCE_ARTIFACT_DIR"
          set +e
          go test ./internal/services/agent -run '^TestReviewCredentialInputIsPrivateFromSetupAndWarmVerifier$' -count=1 -parallel=1 -v -timeout=120s \
            > "$RUNNER_TEMP/review-credential-fixture.log" 2>&1
          status=$?
          tail -c 65536 "$RUNNER_TEMP/review-credential-fixture.log" | tee "$REVIEW_ACCEPTANCE_ARTIFACT_DIR/credential-fixture.log"
          exit "$status"
      - name: Install the supported gVisor runtime
        run: |
          # Match deploy/scripts/bootstrap.sh's package source and runtime flags.
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install -- --ignore-cgroups --host-uds=open
          sudo systemctl restart docker
          runsc --version | tee "$REVIEW_ACCEPTANCE_ARTIFACT_DIR/runsc-version.txt"
          echo "REVIEW_ACCEPTANCE_RUNSC_VERSION=$(runsc --version | head -n 1)" >> "$GITHUB_ENV"
          docker info --format '{{json .Runtimes}}' | tee "$REVIEW_ACCEPTANCE_ARTIFACT_DIR/docker-runtimes.json"
      - name: Build the actual sandbox image
        run: |
          set +e
          docker build --label "org.opencontainers.image.revision=$REVIEW_ACCEPTANCE_SOURCE_SHA" \
            -t "$REVIEW_ACCEPTANCE_IMAGE" -f sandbox/Dockerfile . \
            > "$RUNNER_TEMP/review-image-build.log" 2>&1
          status=$?
          tail -c 65536 "$RUNNER_TEMP/review-image-build.log" | tee "$REVIEW_ACCEPTANCE_ARTIFACT_DIR/image-build.log"
          exit "$status"
      - name: Create an isolated acceptance network
        run: docker network create "$REVIEW_ACCEPTANCE_NETWORK"
      - name: Run container acceptance with bounded evidence
        run: |
          set +e
          make test-review-container-acceptance > "$RUNNER_TEMP/review-acceptance-test.log" 2>&1
          status=$?
          tail -c 65536 "$RUNNER_TEMP/review-acceptance-test.log" | tee "$REVIEW_ACCEPTANCE_ARTIFACT_DIR/acceptance-test.log"
          exit "$status"
      - name: Remove remaining acceptance containers and network
        if: always()
        run: |
          if docker network inspect "$REVIEW_ACCEPTANCE_NETWORK" >/dev/null 2>&1; then
            mapfile -t containers < <(docker ps -aq --filter "network=$REVIEW_ACCEPTANCE_NETWORK")
            if (( ${#containers[@]} )); then docker rm -f "${containers[@]}"; fi
            docker network rm "$REVIEW_ACCEPTANCE_NETWORK"
          fi
      - name: Upload container acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: review-workspace-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/review-workspace-acceptance
          if-no-files-found: error
          retention-days: 14

  required-checks:
    name: All Checks Pass
    needs: [changes, backend-lint, backend-test, frontend-lint, frontend-test, session-transcript-e2e, migration-check, docker-build, security, deploy-scripts-test, deploy-config-test, review-workspace-acceptance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "backend-lint: ${{ needs.backend-lint.result }}"
          echo "backend-test: ${{ needs.backend-test.result }}"
          echo "frontend-lint: ${{ needs.frontend-lint.result }}"
          echo "frontend-test: ${{ needs.frontend-test.result }}"
          echo "session-transcript-e2e: ${{ needs.session-transcript-e2e.result }}"
          echo "migration-check: ${{ needs.migration-check.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "deploy-config-test: ${{ needs.deploy-config-test.result }}"
          echo "deploy-scripts-test: ${{ needs.deploy-scripts-test.result }}"
          echo "review-workspace-acceptance: ${{ needs.review-workspace-acceptance.result }}"

          if [[ "${{ needs.deploy-config-test.result }}" != "success" ]]; then
            echo "::error::Deployment configuration checks must succeed"
            exit 1
          fi

          for result in \
            "${{ needs.backend-lint.result }}" \
            "${{ needs.backend-test.result }}" \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-test.result }}" \
            "${{ needs.session-transcript-e2e.result }}" \
            "${{ needs.migration-check.result }}" \
            "${{ needs.docker-build.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.deploy-scripts-test.result }}" \
            "${{ needs.deploy-config-test.result }}" \
            "${{ needs.review-workspace-acceptance.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::One or more required checks failed"
              exit 1
            fi
          done
          echo "All checks passed"
