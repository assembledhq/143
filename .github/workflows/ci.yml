name: CI

on:
  pull_request:
    branches: [main, 'codex/review-evidence-*']
  push:
    branches: [main]
  schedule:
    # Twice daily backstop for changes that affected-test runs missed.
    # Shared frontend infrastructure also runs full coverage before merge.
    - cron: "17 10,22 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  GOFLAGS: "-buildvcs=false"
  NODE_VERSION: "24"
  BACKEND_COVERAGE_MIN: "70.0"
  BACKEND_COVERAGE_TARGET: "75.0"
  FRONTEND_COVERAGE_MIN: "80.0"
  FRONTEND_COVERAGE_TARGET: "85.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      demo_seed: ${{ steps.filter.outputs.demo_seed }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy: ${{ steps.filter.outputs.deploy }}
      ci: ${{ steps.filter.outputs.ci }}
      session_transcript_e2e: ${{ steps.filter.outputs.session_transcript_e2e }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.143/config.json'
              - '.143/review-dependencies*'
              - 'scripts/verify_code_review_export.py'
              - 'scripts/test_verify_code_review_export.py'
              - 'scripts/code_review_export_*.py'
              - 'scripts/test_code_review_export_custodian.py'
            frontend:
              - 'frontend/**'
            migrations:
              - 'migrations/**'
              - 'cmd/migrate/**'
              - 'go.mod'
              - 'go.sum'
            demo_seed:
              - '.143/seed/**'
              - 'cmd/demo-seed/**'
              - 'internal/demoseed/**'
              - 'migrations/**'
              - 'Makefile'
            docker:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'frontend/Dockerfile*'
              - 'sandbox/Dockerfile*'
              - 'sandbox/versions.json'
              - '.dockerignore'
            deploy:
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'go.mod'
              - 'go.sum'
            ci:
              - '.githooks/**'
              - 'scripts/preflight.py'
              - 'scripts/test_preflight.py'
              - 'Makefile'
              - 'setup.sh'
              - '.golangci.yml'
              - '.github/workflows/**'
              - '.github/scripts/**'
            # Keep this deliberately broad while activity capsules own the
            # transcript renderer. One central classifier prevents required
            # checks from silently disappearing on backend contract changes.
            session_transcript_e2e:
              - 'frontend/**'
              - 'internal/**'
              - 'migrations/**'
              - '.github/workflows/**'

  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.migrations == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Multi-tenancy guardrails (schema + stores)
        run: make lint-tenancy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  backend-test:
    name: Backend Test
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.demo_seed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
      # Drives DB-backed migration behavior tests (e.g. the coding-credential
      # versioning test in internal/db). They self-skip when unset, so this
      # must point at the job's Postgres container or they never run anywhere.
      TEST_DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test CI helper scripts
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -B -m unittest discover -s scripts -p 'test_preflight.py'
      - name: Start Postgres with registry fallback
        id: postgres
        timeout-minutes: 10
        run: bash .github/scripts/start-ci-postgres.sh
      - name: Preload preview infrastructure test image
        timeout-minutes: 10
        # Fail early if every source is unavailable, before compiling the suite.
        # Preserve the production template's image name and PostgreSQL variant.
        run: |
          bash .github/scripts/pull-ci-image.sh postgres:17-alpine \
            public.ecr.aws/docker/library/postgres:17-alpine \
            mirror.gcr.io/library/postgres:17-alpine \
            postgres:17-alpine
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # Lightweight jobs must not populate Backend Test's build cache.
          cache: false

      - name: Identify backend Go cache
        id: go-cache
        run: |
          go_version="$(go env GOVERSION)"
          go_build_cache="$(go env GOCACHE)"
          go_module_cache="$(go env GOMODCACHE)"
          mode=count
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=race-atomic
          fi
          family="backend-go-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${go_version}"
          {
            echo "family=$family"
            echo "scope=${family}-${mode}"
            echo "build=$go_build_cache"
            echo "modules=$go_module_cache"
          } >> "$GITHUB_OUTPUT"

      - name: Cache backend Go modules and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          # Cache entries are immutable. Each commit saves the complete warmed
          # backend cache after success, reusing compatible objects on restore.
          key: ${{ steps.go-cache.outputs.scope }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          # New PRs can fall back to main's race-mode cache: Go itself keys
          # objects by build flags, while modules are reusable across modes.
          restore-keys: |
            ${{ steps.go-cache.outputs.scope }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ steps.go-cache.outputs.scope }}-
            ${{ steps.go-cache.outputs.family }}-

      - name: Reset cached Go test results
        # Cached results do not track external PostgreSQL state. Keep compiled
        # objects and downloaded modules, but execute every test against its fixtures.
        run: go clean -testcache

      - name: Test review dependency recipe
        run: python3 -B .143/review-dependencies_test.py

      - name: Download Go modules
        run: go mod download

      - name: Wait for Postgres
        run: go run ./cmd/wait-postgres

      - name: Verify Postgres lock table size for parallel schema tests
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        # Parallel fixtures apply the full migration chain in isolated schemas.
        # Dropping those schemas together can exhaust the default lock table.
        # The container starts with the larger lock table; verify it before migrations.
        run: |
          actual=$(docker exec "$POSTGRES_CONTAINER" psql -U onefortythree -d onefortythree -At \
            -c 'SHOW max_locks_per_transaction')
          echo "max_locks_per_transaction=$actual"
          test "$actual" = "256"

      - name: Run go vet and migrations
        run: |
          go run cmd/migrate/main.go up
          go vet ./...

      - name: Validate demo seed against the migrated schema
        if: needs.changes.outputs.demo_seed == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
        run: make demo-seed-check

      - name: Run backend unit tests outside database, demoseed, agent, and worker packages
        timeout-minutes: 10
        run: |
          mode=count
          race=()
          package_timeout=120s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            package_timeout=180s
          fi
          packages="$(go list ./internal/...)"
          unit_packages=()
          while IFS= read -r package; do
            if [[ "$package" != "github.com/assembledhq/143/internal/db" && \
                  "$package" != "github.com/assembledhq/143/internal/demoseed" && \
                  "$package" != "github.com/assembledhq/143/internal/services/agent" && \
                  "$package" != "github.com/assembledhq/143/internal/worker" ]]; then
              unit_packages+=("$package")
            fi
          done <<< "$packages"
          go test -json "${unit_packages[@]}" -skip '^TestBrowserChromeDP' -coverpkg=./internal/... \
            -coverprofile=coverage-unit-other.out -covermode="$mode" "${race[@]}" -timeout="$package_timeout"

      # Demo checks create, migrate, seed, and drop complete sibling databases.
      # Serialize those fixtures outside the general concurrent package batch.
      - name: Run demoseed tests
        id: demoseed_tests
        timeout-minutes: 10
        run: |
          mode=count
          race=()
          package_timeout=300s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            package_timeout=360s
          fi
          diagnostics="${RUNNER_TEMP:?}/ci-demoseed-diagnostics"
          mkdir -p "$diagnostics"
          set +e
          go test -json ./internal/demoseed -p=1 -parallel=1 -count=1 -coverpkg=./internal/... \
            -coverprofile=coverage-unit-demoseed.out -covermode="$mode" "${race[@]}" -timeout="$package_timeout" \
            2>"$diagnostics/go-test.stderr.log" | tee "$diagnostics/go-test.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          capture_status="${statuses[1]}"
          if ! cat "$diagnostics/go-test.stderr.log" >&2; then
            echo "::warning::Could not replay demoseed test stderr"
            capture_status=1
          fi
          if ! printf 'go_test=%s\njson_capture=%s\n' "${statuses[0]}" "$capture_status" >"$diagnostics/exit-status.txt"; then
            echo "::warning::Could not retain demoseed test exit statuses"
            capture_status=1
          fi
          # Preserve the test failure even if diagnostic capture also fails.
          if [[ "${statuses[0]}" != "0" ]]; then
            exit "${statuses[0]}"
          fi
          exit "$capture_status"

      - name: Collect demoseed test PostgreSQL diagnostics
        if: ${{ !cancelled() && (steps.demoseed_tests.outcome == 'success' || steps.demoseed_tests.outcome == 'failure') }}
        timeout-minutes: 1
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
          CI_POSTGRES_DIAGNOSTICS_SCOPE: demoseed
        run: bash .github/scripts/collect-ci-postgres-diagnostics.sh

      - name: Upload demoseed test diagnostics
        if: ${{ !cancelled() && (steps.demoseed_tests.outcome == 'success' || steps.demoseed_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: demoseed-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-demoseed-diagnostics/
          retention-days: 7
          if-no-files-found: error

      # Full-schema Postgres fixtures need their own bounded package budget.
      # Keep database work outside the concurrent general package suite.
      # Bound overlapping fixtures, not the concurrency exercised inside a test.
      - name: Run database tests
        id: database_tests
        timeout-minutes: 10
        run: |
          mode=count
          race=()
          package_timeout=300s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(--race)
            package_timeout=360s
          fi
          diagnostics="${RUNNER_TEMP:?}/ci-db-diagnostics"
          mkdir -p "$diagnostics"
          # Partition root tests so suite growth cannot exhaust one package budget.
          # Every root (including fuzz seeds and examples) runs in exactly one shard.
          # Keep stderr separate so compiler/Redis warnings cannot corrupt JSONL.
          # Disable errexit only while copying both pipeline statuses immediately.
          set +e
          python3 -B .github/scripts/run_go_test_shards.py --shards=4 --diagnostics="$diagnostics" \
            --coverprofile=coverage-unit-db.out --covermode="$mode" --timeout="$package_timeout" "${race[@]}" \
            2>"$diagnostics/go-test.stderr.log" | tee "$diagnostics/go-test.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          capture_status="${statuses[1]}"
          if ! cat "$diagnostics/go-test.stderr.log" >&2; then
            echo "::warning::Could not replay database test stderr"
            capture_status=1
          fi
          if ! printf 'go_test=%s\njson_capture=%s\n' "${statuses[0]}" "$capture_status" >"$diagnostics/exit-status.txt"; then
            echo "::warning::Could not retain database test exit statuses"
            capture_status=1
          fi
          # A diagnostic/capture failure must never replace the original test failure.
          if [[ "${statuses[0]}" != "0" ]]; then
            exit "${statuses[0]}"
          fi
          exit "$capture_status"

      - name: Collect database test PostgreSQL diagnostics
        if: ${{ !cancelled() && (steps.database_tests.outcome == 'success' || steps.database_tests.outcome == 'failure') }}
        timeout-minutes: 1
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        run: bash .github/scripts/collect-ci-postgres-diagnostics.sh

      - name: Upload database test diagnostics
        if: ${{ !cancelled() && (steps.database_tests.outcome == 'success' || steps.database_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: database-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-db-diagnostics/
          retention-days: 7
          if-no-files-found: error

      # Full-schema Postgres fixtures in worker need their own bounded budget.
      # Run that package separately from the concurrent general package suite.
      - name: Run worker unit tests
        timeout-minutes: 10
        run: |
          mode=count
          race=()
          package_timeout=300s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            package_timeout=360s
          fi
          # Retain individual test events when a failure has only a package summary.
          go test -json ./internal/worker -coverpkg=./internal/... -coverprofile=coverage-unit-worker.out \
            -covermode="$mode" "${race[@]}" -timeout="$package_timeout"

      - name: Run agent unit tests
        timeout-minutes: 10
        run: |
          mode=count
          race=()
          package_timeout=300s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            package_timeout=360s
          fi
          go test ./internal/services/agent -coverpkg=./internal/... -coverprofile=coverage-unit-agent.out \
            -covermode="$mode" "${race[@]}" -timeout="$package_timeout"

      - name: Combine backend unit coverage
        run: python3 .github/scripts/merge_go_coverage.py coverage-unit.out coverage-unit-other.out coverage-unit-demoseed.out coverage-unit-db.out coverage-unit-worker.out coverage-unit-agent.out

      - name: Test offline review export archive utilities
        run: python3 -B -m unittest discover -s scripts -p 'test_*code_review_export*.py'

      - name: Run command tests
        id: command_tests
        timeout-minutes: 10
        run: |
          race=()
          shard_race=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            race=(-race)
            shard_race=(--race)
          fi
          # Bound fresh-database creation/drop across packages and parallel tests,
          # without reducing concurrency exercised inside individual tests.
          diagnostics="${RUNNER_TEMP:?}/ci-command-diagnostics"
          mkdir -p "$diagnostics"
          run_command_partitions() {
            local packages package ordinary_status migration_status
            local command_packages=()
            local migration_found=0
            packages="$(go list ./cmd/...)" || return "$?"
            while IFS= read -r package; do
              if [[ "$package" == "github.com/assembledhq/143/cmd/migrate" ]]; then
                migration_found=1
              elif [[ -n "$package" ]]; then
                command_packages+=("$package")
              fi
            done <<< "$packages"
            if [[ "$migration_found" != "1" || "${#command_packages[@]}" == "0" ]]; then
              echo "::error::Unable to discover both command test partitions" >&2
              return 1
            fi
            go test -json "${command_packages[@]}" -p=1 -parallel=2 -count=1 "${race[@]}" -timeout=300s
            ordinary_status="$?"
            # Each exact root runs once, with all its subtests, in a fresh
            # bounded process. Keep the same in-test concurrency and timeout.
            python3 -B .github/scripts/run_go_test_shards.py --package=./cmd/migrate --shards=4 \
              --diagnostics="$diagnostics/migrate-shards" --timeout=300s "${shard_race[@]}"
            migration_status="$?"
            if ! printf 'ordinary_commands=%s\nmigration_shards=%s\n' "$ordinary_status" "$migration_status" >"$diagnostics/partition-status.txt"; then
              echo "::warning::Could not retain command partition statuses" >&2
              if [[ "$ordinary_status" == "0" && "$migration_status" == "0" ]]; then
                return 1
              fi
            fi
            if [[ "$ordinary_status" != "0" ]]; then
              return "$ordinary_status"
            fi
            return "$migration_status"
          }
          set +e
          run_command_partitions \
            2>"$diagnostics/go-test.stderr.log" | tee "$diagnostics/go-test.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          capture_status="${statuses[1]}"
          if ! cat "$diagnostics/go-test.stderr.log" >&2; then
            echo "::warning::Could not replay command test stderr"
            capture_status=1
          fi
          if ! printf 'go_test=%s\njson_capture=%s\n' "${statuses[0]}" "$capture_status" >"$diagnostics/exit-status.txt"; then
            echo "::warning::Could not retain command test exit statuses"
            capture_status=1
          fi
          # Preserve the test failure even if diagnostic capture also fails.
          if [[ "${statuses[0]}" != "0" ]]; then
            exit "${statuses[0]}"
          fi
          exit "$capture_status"

      - name: Collect command test PostgreSQL diagnostics
        if: ${{ !cancelled() && (steps.command_tests.outcome == 'success' || steps.command_tests.outcome == 'failure') }}
        timeout-minutes: 1
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
          CI_POSTGRES_DIAGNOSTICS_SCOPE: command
        run: bash .github/scripts/collect-ci-postgres-diagnostics.sh

      - name: Upload command test diagnostics
        if: ${{ !cancelled() && (steps.command_tests.outcome == 'success' || steps.command_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: command-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-command-diagnostics/
          retention-days: 7
          if-no-files-found: error

      # Chrome startup and rendering need CPU that the parallel backend suite
      # can otherwise consume. Keep real browser fixtures in a serial step,
      # with the same race mode and their own coverage contribution.
      - name: Run preview browser lifecycle tests
        timeout-minutes: 5
        env:
          TEST_BROWSER_REQUIRED: "1"
        run: |
          preview_chrome_path="$(command -v google-chrome)"
          preview_chrome_binary="$(readlink -f "$preview_chrome_path")"
          test -x "$preview_chrome_binary"
          preview_chrome_version="$(bash .github/scripts/probe-preview-chrome.sh "$preview_chrome_binary")"
          preview_chrome_dir="$(mktemp -d "${RUNNER_TEMP:?}/preview-chrome.XXXXXX")"
          trap 'rm -rf "$preview_chrome_dir"' EXIT
          # chromedp discovers headless_shell and Chromium before Google Chrome.
          # This runner-owned alias selects validated Google Chrome for this fixture step.
          ln -s "$preview_chrome_binary" "$preview_chrome_dir/headless_shell"
          test "$(readlink -f "$preview_chrome_dir/headless_shell")" = "$preview_chrome_binary"
          printf 'Preview test browser: %s\n' "$preview_chrome_version"
          mode=count
          race=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
          fi
          PATH="$preview_chrome_dir:$PATH" go test ./internal/services/preview -run '^TestBrowserChromeDP' -parallel=1 -count=1 -v \
            -coverpkg=./internal/... -coverprofile=coverage-browser.out -covermode="$mode" \
            "${race[@]}" -timeout=180s

      # Integration tests run on every backend-test invocation (PR + push).
      # They reuse the Postgres container this job already brings up — no new
      # infra. Build-tag gating means they don't run during the unit-test
      # step above, so we don't double-charge CI for the same code paths.
      - name: Run integration tests
        run: |
          mode=count
          race=()
          timeout=120s
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            mode=atomic
            race=(-race)
            timeout=180s
          fi
          INTEGRATION_DATABASE_URL=$DATABASE_URL \
          go test -tags=integration -coverpkg=./internal/... -coverprofile=coverage-integration.out \
            -covermode="$mode" "${race[@]}" -timeout="$timeout" ./internal/integration/...

      # Exercise real image-declared volumes: mocks cannot prove that Docker
      # removed preview data or preserved explicitly named storage.
      - name: Verify preview infrastructure volume lifecycle
        run: go test -tags=docker_integration ./internal/services/preview/providers -run '^TestDockerIntegration' -count=1 -timeout=180s

      # Measure all backend code exercised by the successful suites, without
      # double-counting statements shared by multiple test binaries.
      - name: Combine backend coverage
        run: |
          python3 .github/scripts/merge_go_coverage.py coverage.out coverage-unit.out coverage-browser.out coverage-integration.out
          go tool cover -func=coverage.out

      - name: Check backend coverage floor
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/check_go_coverage.py coverage.out \
            "$BACKEND_COVERAGE_MIN" "$BACKEND_COVERAGE_TARGET"

      - name: Upload coverage report
        # Keep the evidence available when tests or the coverage floor fail.
        if: ${{ !cancelled() && hashFiles('coverage*.out') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage.out
            coverage-unit.out
            coverage-unit-other.out
            coverage-unit-demoseed.out
            coverage-unit-db.out
            coverage-unit-worker.out
            coverage-unit-agent.out
            coverage-browser.out
            coverage-integration.out

      - name: Stop CI Postgres
        if: always() && steps.postgres.outputs.container_id != ''
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        run: docker rm --force --volumes "$POSTGRES_CONTAINER"

  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  frontend-test:
    name: Frontend Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Select frontend test scope
        id: scope
        working-directory: ${{ github.workspace }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: python3 -B .github/scripts/select_frontend_tests.py

      - run: npm ci

      - name: Run affected tests
        if: steps.scope.outputs.full == 'false'
        timeout-minutes: 10
        env:
          FRONTEND_TEST_BASE: ${{ steps.scope.outputs.base }}
        run: npx vitest run --changed="$FRONTEND_TEST_BASE" --passWithNoTests --reporter=dot

      - name: Run full tests with coverage
        if: steps.scope.outputs.full == 'true'
        timeout-minutes: 20
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=lcov

      - name: Check frontend coverage floor
        if: steps.scope.outputs.full == 'true'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(data.total.lines.pct);
          ")
          echo "Total coverage: ${COVERAGE}%"
          if node -e "process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)" "$COVERAGE" "${FRONTEND_COVERAGE_MIN}"; then
            echo "::error::Frontend coverage ${COVERAGE}% is below the minimum ${FRONTEND_COVERAGE_MIN}%"
            exit 1
          fi
          if node -e "process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)" "$COVERAGE" "${FRONTEND_COVERAGE_TARGET}"; then
            echo "::warning::Frontend coverage ${COVERAGE}% is below target ${FRONTEND_COVERAGE_TARGET}%"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.scope.outputs.full == 'true' && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  session-transcript-e2e:
    name: Session Transcript E2E
    needs: changes
    # required-checks treats a skipped job as passing, so a plain job-level
    # condition is enough — matching every other conditional job here.
    if: needs.changes.outputs.session_transcript_e2e == 'true' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install browser engines
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run focused transcript browser suite
        env:
          SESSION_ACTIVITY_BROWSER_MATRIX: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: npm run test:session-transcript-e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-transcript-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  migration-check:
    name: Migration Safety
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://onefortythree:dev@localhost:5432/onefortythree?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres with registry fallback
        id: postgres
        timeout-minutes: 10
        run: bash .github/scripts/start-ci-postgres.sh
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Wait for Postgres
        run: go run ./cmd/wait-postgres

      - name: Validate migration filenames
        run: go test ./cmd/migrate -run TestMigrationVersionsAreUnique -count=1

      - name: Migrate up
        run: go run cmd/migrate/main.go up

      - name: Migrate down
        run: go run cmd/migrate/main.go down

      - name: Migrate up again (idempotency check)
        run: go run cmd/migrate/main.go up

      - name: Stop CI Postgres
        if: always() && steps.postgres.outputs.container_id != ''
        env:
          POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container_id }}
        run: docker rm --force --volumes "$POSTGRES_CONTAINER"

  docker-build:
    name: Docker Build
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            tags: 143-app:latest
          - name: sandbox
            context: .
            file: sandbox/Dockerfile
            tags: 143-sandbox:latest
          - name: frontend
            context: .
            file: Dockerfile.frontend
            tags: 143-frontend:latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          # Bootstrap must use the cache before BuildKit's mirror config is active.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Cache Docker Hub images through Google's public mirror for CI builds.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build ${{ matrix.name }} Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select cached Go
        run: python3 -B .github/scripts/select-security-go.py

      - name: Run gosec
        run: |
          set -euo pipefail
          test "$(command -v go)" = "$GOROOT/bin/go"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          test "$(command -v gosec)" = "$GOBIN/gosec"
          gosec ./...

  # Config tests read repository-wide inputs; run them for every PR and push.
  deploy-config-test:
    name: Deploy Config Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate deployment configuration
        run: |
          go test ./deploy -count=1 -timeout=120s
          go vet ./deploy

  deploy-scripts-test:
    name: Deploy Scripts Test
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run deploy shell tests
        run: |
          set -euo pipefail
          for t in deploy/scripts/*_test.sh; do
            echo "--- $t"
            bash "$t"
          done

  required-checks:
    name: All Checks Pass
    needs: [changes, backend-lint, backend-test, frontend-lint, frontend-test, session-transcript-e2e, migration-check, docker-build, security, deploy-scripts-test, deploy-config-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "backend-lint: ${{ needs.backend-lint.result }}"
          echo "backend-test: ${{ needs.backend-test.result }}"
          echo "frontend-lint: ${{ needs.frontend-lint.result }}"
          echo "frontend-test: ${{ needs.frontend-test.result }}"
          echo "session-transcript-e2e: ${{ needs.session-transcript-e2e.result }}"
          echo "migration-check: ${{ needs.migration-check.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "deploy-config-test: ${{ needs.deploy-config-test.result }}"
          echo "deploy-scripts-test: ${{ needs.deploy-scripts-test.result }}"

          if [[ "${{ needs.deploy-config-test.result }}" != "success" ]]; then
            echo "::error::Deployment configuration checks must succeed"
            exit 1
          fi

          for result in \
            "${{ needs.backend-lint.result }}" \
            "${{ needs.backend-test.result }}" \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-test.result }}" \
            "${{ needs.session-transcript-e2e.result }}" \
            "${{ needs.migration-check.result }}" \
            "${{ needs.docker-build.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.deploy-scripts-test.result }}" \
            "${{ needs.deploy-config-test.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::One or more required checks failed"
              exit 1
            fi
          done
          echo "All checks passed"
